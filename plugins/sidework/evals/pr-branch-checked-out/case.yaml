schema_version: "1.1"
name: pr-branch-checked-out
context:
  scaffold_script: scaffold.sh
graders:
  - name: pr-branch-beside-checkout
    type: file_exists
    path: "*/src/retry.rs"
    weight: 2
  - name: sidework-naming
    type: file_exists
    path: app-sidework-retry-feedback/src/retry.rs
  - name: no-sidework-branch-cut
    type: file_exists
    path: "app/.git/refs/heads/sidework/**"
    exists: false
  - name: rename-in-worktree
    type: regex
    target: { source: file, path: app-sidework-retry-feedback/src/retry.rs }
    pattern: 'max_tries'
    match: not_contains
  - name: committed-on-pr-branch
    type: regex
    target: { source: file, path: app/.git/logs/refs/heads/feature/retry }
    pattern: '\tcommit'
    weight: 2
  - name: nothing-nested-in-checkout
    type: file_exists
    path: "app/**/justfile"
    exists: false
    weight: 2
  - name: checkout-head-unmoved
    type: regex
    target: { source: file, path: app/.git/logs/HEAD }
    pattern: '^[0-9a-f]{40} [0-9a-f]{40} '
    flags: m
    match: "count:1"
    weight: 2
  - name: checkout-still-on-main
    type: regex
    target: { source: file, path: app/.git/HEAD }
    pattern: '^ref: refs/heads/main$'
    flags: m
  - name: checkout-wip-intact
    type: regex
    target: { source: file, path: app/src/lib.rs }
    pattern: 'wip: trying a warmer greeting'
    weight: 2
  - name: no-stash
    type: file_exists
    path: app/.git/refs/stash
    exists: false
  - name: nothing-pushed-to-origin
    type: file_exists
    path: "origin.git/**"
    exists: false
