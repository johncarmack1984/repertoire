schema_version: "1.1"
name: beside-not-inside
context:
  scaffold_script: scaffold.sh
graders:
  - name: worktree-beside-checkout
    type: file_exists
    path: "*/justfile"
    weight: 2
  - name: sidework-naming
    type: file_exists
    path: app-sidework-lint-recipe/justfile
  - name: fresh-origin-base
    type: file_exists
    path: app-sidework-lint-recipe/CHANGELOG.md
    weight: 2
  - name: gitignored-env-copied
    type: file_exists
    path: app-sidework-lint-recipe/.env
  - name: recipe-in-worktree
    type: regex
    target: { source: file, path: app-sidework-lint-recipe/justfile }
    pattern: 'lint:[\s\S]*clippy'
  - name: committed-on-branch
    type: regex
    target: { source: file, path: app/.git/logs/refs/heads/sidework/lint-recipe }
    pattern: '\tcommit'
  - name: checkout-justfile-untouched
    type: regex
    target: { source: file, path: app/justfile }
    pattern: clippy
    match: not_contains
  - name: nothing-nested-in-checkout
    type: file_exists
    path: "app/**/justfile"
    exists: false
    weight: 2
  - name: checkout-head-unmoved
    type: regex
    target: { source: file, path: app/.git/logs/HEAD }
    pattern: '^[0-9a-f]{40} [0-9a-f]{40} '
    flags: m
    match: "count:1"
    weight: 2
  - name: checkout-still-on-main
    type: regex
    target: { source: file, path: app/.git/HEAD }
    pattern: '^ref: refs/heads/main$'
    flags: m
  - name: checkout-wip-intact
    type: regex
    target: { source: file, path: app/src/lib.rs }
    pattern: 'wip: trying a warmer greeting'
    weight: 2
  - name: no-stash
    type: file_exists
    path: app/.git/refs/stash
    exists: false
  - name: nothing-pushed-to-origin
    type: file_exists
    path: "origin.git/**"
    exists: false
