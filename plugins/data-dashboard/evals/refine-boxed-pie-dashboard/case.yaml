schema_version: "1.1"
name: refine-boxed-pie-dashboard
plugins:
  - ../..
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-dashboard"'
  - name: self-contained
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '<script[^>]*\ssrc\s*=|<link[^>]*\shref\s*=\s*["'']?(?:https?:)?//|url\(\s*["'']?(?:https?:)?//|@import'
    flags: i
    match: not_contains
    weight: 2
  - name: no-forbidden-media
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '<canvas\b|(?:linear|radial|conic)-gradient\s*\(|<(?:linear|radial)Gradient\b|box-shadow\s*:\s*(?!none\b)[^;}"''\s]|type\s*:\s*["''](?:pie|doughnut|gauge|radar|polarArea)["'']'
    flags: i
    match: not_contains
    weight: 2
  - name: no-hand-drawn-shapes
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '<(?:rect|circle|path)\b'
    match: not_contains
    weight: 2
  - name: no-green-status-fill
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '#2ecc71|#27ae60'
    flags: i
    match: not_contains
  - name: no-cents
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '\$4,182,377\.45|\$2,946,105\.18|\$1,873,662\.90|\$812,419\.37|\$455,231\.64|\$10,269,796\.54|\$3,104,882\.12|\$1,488,320\.05|\$3,019,690\.60|\$2,215,903\.77'
    match: not_contains
  - name: library-inlined
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: 'data-dashboard:lib \d+\.\d+\.\d+'
  - name: keeps-every-region
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '^(?=[\s\S]*North America)(?=[\s\S]*Europe)(?=[\s\S]*Asia Pacific)(?=[\s\S]*Latin America)(?=[\s\S]*Middle East)'
    weight: 2
  - name: keeps-every-measure
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '^(?=[\s\S]*on[- ]time delivery)(?=[\s\S]*customer satisfaction)(?=[\s\S]*gross margin)(?=[\s\S]*fill rate)(?=[\s\S]*hardware)(?=[\s\S]*software)(?=[\s\S]*services)(?=[\s\S]*support)(?=[\s\S]*training)'
    flags: i
    weight: 2
  - name: no-blue
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '#(?:0[0-9a-f]{3}[5-9a-f]|1[0-9a-f]{3}[6-9a-f]|2[0-9a-f]{3}[7-9a-f]|3[0-9a-f]{3}[89a-f]|4[0-9a-f]{3}[9a-f]|5[0-9a-f]{3}[a-f]|6[0-9a-f]{3}[b-f]|7[0-9a-f]{3}[c-f]|8[0-9a-f]{3}[d-f]|9[0-9a-f]{3}[ef])[0-9a-f](?:[0-9a-f]{2})?(?![0-9a-f])|rgba?\(\s*(?:\d|[1-9]\d|1[01]\d)\s*,\s*\d{1,3}\s*,\s*(?:1[89]\d|2[0-5]\d)\s*[,)]|(?:[:=]\s*|["''])(?:blue|steelblue|royalblue|dodgerblue|cornflowerblue|deepskyblue|skyblue|lightblue)\b(?!-)'
    flags: i
    match: not_contains
  - name: no-boxed-panels
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: 'border-radius\s*:\s*(?:[4-9]|[1-4]\d)(?:\.\d+)?px|(?<![-\w])border\s*:\s*(?:[1-9]\d*(?:\.\d+)?px\s+)?(?:solid|dashed|double)\b'
    flags: i
    match: not_contains
  - name: sized-to-the-screen
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '(?<![-\w])height\s*:\s*100d?vh'
    flags: i
  - name: every-number-survives
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: '^(?=[\s\S]*(?<![\d.])(?:4,?182(?:,?\d{3})?|4\.18)(?!\d))(?=[\s\S]*(?<![\d.])(?:4,?050(?:,?\d{3})?|4\.05)(?!\d))(?=[\s\S]*(?<![\d.])(?:2,?946(?:,?\d{3})?|2\.9[45])(?!\d))(?=[\s\S]*(?<![\d.])(?:3,?100(?:,?\d{3})?|3\.10?)(?!\d))(?=[\s\S]*(?<![\d.])(?:1,?873(?:,?\d{3})?|1\.87)(?!\d))(?=[\s\S]*(?<![\d.])(?:1,?950(?:,?\d{3})?|1\.95)(?!\d))(?=[\s\S]*(?<![\d.])(?:812(?:,?\d{3})?|0?\.81)(?!\d))(?=[\s\S]*(?<![\d.])(?:780(?:,?\d{3})?|0?\.78)(?!\d))(?=[\s\S]*(?<![\d.])(?:455(?:,?\d{3})?|0?\.4[56])(?!\d))(?=[\s\S]*(?<![\d.])(?:560(?:,?\d{3})?|0?\.56)(?!\d))(?=[\s\S]*(?<![\d.])(?:3,?104(?:,?\d{3})?|3\.10)(?!\d))(?=[\s\S]*(?<![\d.])(?:3,?019(?:,?\d{3})?|3\.02)(?!\d))(?=[\s\S]*(?<![\d.])(?:2,?215(?:,?\d{3})?|2\.2[12])(?!\d))(?=[\s\S]*(?<![\d.])(?:1,?488(?:,?\d{3})?|1\.49)(?!\d))(?=[\s\S]*(?<![\d.])(?:441(?:,?\d{3})?|0?\.44)(?!\d))(?=[\s\S]*(?<![\d.])(?:94\.[34]\d*|0?\.94[34]\d*)(?!\d))(?=[\s\S]*(?<![\d.])(?:95(?:\.0+)?|0?\.95)(?!\d))(?=[\s\S]*(?<![\d.])(?:4\.2\d*)(?!\d))(?=[\s\S]*(?<![\d.])(?:4\.30?)(?!\d))(?=[\s\S]*(?<![\d.])(?:31\.8\d*|0?\.318\d*)(?!\d))(?=[\s\S]*(?<![\d.])(?:33(?:\.0+)?|0?\.33)(?!\d))(?=[\s\S]*(?<![\d.])(?:97\.1\d*|0?\.971\d*)(?!\d))(?=[\s\S]*(?<![\d.])(?:98(?:\.0+)?|0?\.98)(?!\d))'
    weight: 3
  - name: no-logo
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: 'class\s*=\s*["'']logo["'']|\.logo\s*\{'
    flags: i
    match: not_contains
  - name: no-refresh-to-the-second
    type: regex
    target: { source: file, path: dashboard/index.html }
    pattern: 'refreshed?[^<]{0,40}(?<![T\d])\d{1,2}:\d{2}:\d{2}'
    flags: i
    match: not_contains
