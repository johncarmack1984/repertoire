schema_version: "1.1"
name: web-visitors-three-resolutions
plugins:
  - ../..
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-dashboard"'
  - name: wrote-the-dashboard
    type: file_exists
    path: web-analysis.html
    weight: 2
  - name: self-contained
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '<script[^>]*\ssrc\s*=|<link[^>]*\shref\s*=\s*["'']?(?:https?:)?//|url\(\s*["'']?(?:https?:)?//|@import'
    flags: i
    match: not_contains
    weight: 2
  - name: no-forbidden-media
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '<canvas\b|(?:linear|radial|conic)-gradient\s*\(|<(?:linear|radial)Gradient\b|box-shadow\s*:\s*(?!none\b)[^;}"''\s]|type\s*:\s*["''](?:pie|doughnut|gauge|radar|polarArea)["'']'
    flags: i
    match: not_contains
    weight: 2
  - name: no-hand-drawn-shapes
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '<(?:rect|circle|path)\b'
    match: not_contains
  - name: library-inlined
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: 'data-dashboard:lib \d+\.\d+\.\d+'
  - name: data-block
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: 'id\s*=\s*["'']dd-data["'']'
  - name: line-graphs
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: 'id\s*=\s*["'']dd-data["''](?:(?!data-dashboard:lib)[\s\S])*?\b(?:dd|DataDashboard)\.line\s*\('
  - name: as-of-with-zone
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '"asOf"\s*:\s*"\d{4}-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:Z|[+-]\d\d:?\d\d)"|as of[^<]{0,60}\d{1,2}:\d\d[^<]{0,20}\b(?:[ECMP][SD]T|UTC|GMT|Pacific)\b'
    flags: i
  - name: no-alert-states
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '"state"\s*:\s*"(?:alert|warn)"|"alert"\s*:\s*0?\.\d*[1-9]|\balertWhen\s*:|class(?:Name)?\s*[:=]\s*["''][^"'']*\b(?:alert|warning|critical|danger)\b'
    flags: i
    match: not_contains
    weight: 2
  - name: products-referrers-and-pairs
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '^(?=[\s\S]*pleated skirt)(?=[\s\S]*reddit\.com)(?=[\s\S]*trailnotes\.blog)(?=[\s\S]*bought together)(?=[\s\S]*(?:shown together|rarely bought))'
    flags: i
  - name: referrer-change-keeps-sign
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: 'facebook\.com[\s\S]{0,400}?(?:−|-|&minus;)\s?(?:0?\.22|22)(?!\d)'
    flags: i
  - name: deviations-in-the-data
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: 'id\s*=\s*["'']dd-data["''][^>]*>(?=(?:(?!</script>)[\s\S])*?-0?\.(?:29|30?)\d*\b)(?=(?:(?!</script>)[\s\S])*?-0?\.3[78]\d*\b)'
    weight: 2
  - name: no-orange-or-yellow
    type: regex
    target: { source: file, path: web-analysis.html }
    pattern: '#[c-f][0-9a-f][4-9a][0-9a-f][0-4][0-9a-f](?:[0-9a-f]{2})?(?![0-9a-f])|#[c-f][0-9a-f][b-f][0-9a-f][0-6][0-9a-f](?:[0-9a-f]{2})?(?![0-9a-f])|#[c-f][4-9a-f][0-4](?![0-9a-f])|(?:[:=]\s*|["''])(?:orange|darkorange|orangered|coral|tomato|gold|goldenrod|yellow|amber)\b(?!-)'
    flags: i
    match: not_contains
