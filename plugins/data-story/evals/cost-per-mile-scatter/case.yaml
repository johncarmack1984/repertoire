schema_version: "1.1"
name: cost-per-mile-scatter
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-chart
    type: file_exists
    path: fleet.svg
    weight: 2
  - name: points-drawn
    type: regex
    target: { source: file, path: fleet.svg }
    pattern: '<(circle|ellipse)\b'
  - name: average-labelled
    type: regex
    target: { source: file, path: fleet.svg }
    pattern: '>[^<]*\b(average|avg|mean)\b[^<]*<'
    flags: i
    weight: 2
  - name: axes-say-what-they-are
    type: regex
    target: { source: file, path: fleet.svg }
    pattern: 'miles[\s\S]*per mile|per mile[\s\S]*miles'
    flags: i
  - name: no-trailing-zeros-on-the-axis
    type: regex
    target: { source: file, path: fleet.svg }
    pattern: '>\s*\$?\d+\.00\s*<'
    match: not_contains
  # Routing indicators: reported, not scored. They show which of the skill's files the run read.
  - name: read-context
    type: tool_used
    tool: Read
    input_match: 'chapters/context\.md'
    min: 1
    arm: with-only
  - name: read-scatterplot
    type: tool_used
    tool: Read
    input_match: 'visuals/scatterplot\.md'
    min: 1
    arm: with-only
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!scatterplot\.md)[\w-]+\.md'
    max: 0
    arm: with-only
  - name: read-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 3
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
