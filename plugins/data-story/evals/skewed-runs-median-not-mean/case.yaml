schema_version: "1.1"
name: skewed-runs-median-not-mean
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-section
    type: file_exists
    path: pr-numbers.md
    weight: 2
  - name: medians
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: median
    flags: i
    weight: 2
  - name: change-from-the-medians
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '(−|-|–)\s?12\s?(%|percent)|12\s?(%|percent)\s+(faster|lower|less|quicker|shorter|drop|improvement)|\b88\s?ms\b'
    flags: i
    weight: 2
  - name: slow-runs-reported
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '1,?[12][0-9]{2}\s?ms|two (slow|outl)|outlier|slowest|tail'
    flags: i
    weight: 2
  - name: run-count
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '\b(12|twelve)\b[^\n]*\bruns\b'
    flags: i
  # Routing indicators: reported, not scored. They show which of the skill's files the run read.
  - name: read-context
    type: tool_used
    tool: Read
    input_match: 'chapters/context\.md'
    min: 1
    arm: with-only
  - name: read-simple-text-or-table
    type: tool_used
    tool: Read
    input_match: 'visuals/(simple-text|table)\.md'
    min: 1
    arm: with-only
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!(simple-text|table)\.md)[\w-]+\.md'
    max: 0
    arm: with-only
  - name: no-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    max: 0
    arm: with-only
  - name: read-measurements
    type: tool_used
    tool: Read
    input_match: 'reference/measurements\.md'
    min: 1
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
