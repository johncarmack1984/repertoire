schema_version: "1.1"
name: ticket-backlog-hiring-request
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-chart
    type: file_exists
    path: tickets.svg
    weight: 2
  - name: lines-drawn
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '<(polyline|path)\b'
  - name: lines-labelled-by-name
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '^(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?Received)(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?Processed)'
  - name: the-ask-in-words
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?(?:approv|\bhir(e|es|ing)\b|backfill|headcount)'
    flags: i
    weight: 2
  - name: no-trailing-zeros-on-the-axis
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '>\s*\d+\.00\s*<'
    match: not_contains
  - name: months-abbreviated
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '>\s*(January|February|September|November|December)\s*<'
    match: not_contains
  - name: source-noted
    type: regex
    target: { source: file, path: tickets.svg }
    pattern: '<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?(?:source|dashboard)'
    flags: i
  # Routing indicators: reported, not scored. They show which of the skill's files the run read.
  - name: read-context
    type: tool_used
    tool: Read
    input_match: 'chapters/context\.md'
    min: 1
    arm: with-only
  - name: read-line
    type: tool_used
    tool: Read
    input_match: 'visuals/line\.md'
    min: 1
    arm: with-only
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!line\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: read-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 3
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
