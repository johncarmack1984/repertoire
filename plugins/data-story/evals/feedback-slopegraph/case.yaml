schema_version: "1.1"
name: feedback-slopegraph
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-chart
    type: file_exists
    path: feedback.svg
    weight: 2
  - name: lines-drawn
    type: regex
    target: { source: file, path: feedback.svg }
    pattern: '<(line|polyline|path)\b'
  - name: both-years-named
    type: regex
    target: { source: file, path: feedback.svg }
    pattern: '2014[\s\S]*2015'
  - name: career-development-named
    type: regex
    target: { source: file, path: feedback.svg }
    pattern: 'career development'
    flags: i
  - name: no-rotated-text
    type: regex
    target: { source: file, path: feedback.svg }
    pattern: 'rotate\('
    match: not_contains
  # Routing indicators: reported, not scored. They show which of the skill's files the run read.
  - name: read-context
    type: tool_used
    tool: Read
    input_match: 'chapters/context\.md'
    min: 1
    arm: with-only
  - name: read-slopegraph
    type: tool_used
    tool: Read
    input_match: 'visuals/slopegraph\.md'
    min: 1
    arm: with-only
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!slopegraph\.md)[\w-]+\.md'
    max: 0
    arm: with-only
  - name: read-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 3
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
