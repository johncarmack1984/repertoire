schema_version: "1.1"
name: design-concerns-three-are-noise
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-chart
    type: file_exists
    path: concerns.svg
    weight: 2
  - name: bars-drawn
    type: regex
    target: { source: file, path: concerns.svg }
    pattern: '<rect\b'
  - name: values-on-the-bars
    type: regex
    target: { source: file, path: concerns.svg }
    pattern: '^(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?\b12\.9\b)(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?\b8\.2\b)'
  - name: title-says-three
    type: regex
    target: { source: file, path: concerns.svg }
    pattern: '<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?(?:\b(three|3)\b[^<]{0,80}\b(noise|ten|10)\b|\bnoise\b[^<]{0,60}\b(first|three|3)\b)'
    flags: i
    weight: 2
  - name: what-the-comments-say
    type: regex
    target: { source: file, path: concerns.svg }
    pattern: '<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?(?:\brain\b|freeway|highway|\bsat\b|sitting|cold start)'
    flags: i
  - name: no-rotated-text
    type: regex
    target: { source: file, path: concerns.svg }
    pattern: 'rotate\('
    match: not_contains
  # Routing indicators: reported, not scored. They show which of the skill's files the run read.
  - name: read-context
    type: tool_used
    tool: Read
    input_match: 'chapters/context\.md'
    min: 1
    arm: with-only
  - name: read-bars
    type: tool_used
    tool: Read
    input_match: 'visuals/bars\.md'
    min: 1
    arm: with-only
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!bars\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: read-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 3
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
