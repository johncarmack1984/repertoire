schema_version: "1.1"
name: two-numbers-stay-a-sentence
plugins:
  - ../..
  - ../../../write-with-style
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-note
    type: file_exists
    path: pr-numbers.md
    weight: 2
  - name: no-table
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '^\s*\|'
    flags: m
    match: not_contains
    weight: 3
  - name: no-bullet-list
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '^\s*[-*+] '
    flags: m
    match: not_contains
  - name: spread-given
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '1\.80[\s\S]*1\.90|1\.18[\s\S]*1\.25|overlap|slowest[\s\S]{0,120}fastest|fastest[\s\S]{0,120}slowest|every (one of the )?(ten )?(branch )?runs?'
    flags: i
    weight: 2
  - name: both-values-stated
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '1\.84[\s\S]*1\.21|1\.21[\s\S]*1\.84'
  - name: size-of-the-change
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '\b3[34]\s?(%|percent)|\bthird\b|1\.5\s?(x|×|times)|0\.6[0-9]\s?s\b'
    flags: i
  - name: medians
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: median
    flags: i
  - name: run-count
    type: regex
    target: { source: file, path: pr-numbers.md }
    pattern: '\b(10|ten)\b[^\n]*\bruns\b'
    flags: i
  # Routing indicators: reported, not scored. A skill file can be read with Read or with cat, so each never-read check has a shell twin.
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!simple-text\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: no-other-visuals-in-shell
    type: tool_used
    tool: Bash
    input_match: 'visuals/(?!simple-text\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: no-chart-chapters
    type: tool_used
    tool: Read
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 0
    max: 0
    arm: with-only
  - name: no-chart-chapters-in-shell
    type: tool_used
    tool: Bash
    input_match: 'chapters/(declutter|focus|design)\.md'
    min: 0
    max: 0
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
