schema_version: "1.1"
name: tax-rate-bars-start-at-zero
plugins:
  - ../..
  - ../../../write-with-style
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-story"'
  - name: wrote-the-chart
    type: file_exists
    path: top-rate-new.svg
    weight: 2
  - name: both-rates-shown
    type: regex
    target: { source: file, path: top-rate-new.svg }
    pattern: '^(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?\b35(\.0)?\s?%)(?=[\s\S]*?<text\b[^>]*>(?:[^<]|<(?!/text>)[^>]*>)*?39\.6)'
    weight: 2
  - name: no-axis-starting-at-34
    type: regex
    target: { source: file, path: top-rate-new.svg }
    pattern: '>\s*3[468]\s?%\s*<'
    match: not_contains
    weight: 2
  - name: no-inflated-wording
    type: regex
    target: { source: file, path: top-rate-new.svg }
    pattern: '>[^<]*(skyrocket|explod|soar|surg|spik)[^<]*<|460\s?%'
    flags: i
    match: not_contains
  - name: says-the-axis-was-cut-off
    type: regex
    pattern: 'zero|baseline|truncat|34\s?%|started at 34|cut off'
    flags: i
    weight: 2
  # Routing indicators: reported, not scored. A skill file can be read with Read or with cat, so each never-read check has a shell twin.
  - name: no-other-visuals
    type: tool_used
    tool: Read
    input_match: 'visuals/(?!(bars|simple-text)\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: no-other-visuals-in-shell
    type: tool_used
    tool: Bash
    input_match: 'visuals/(?!(bars|simple-text)\.md)[\w-]+\.md'
    min: 0
    max: 0
    arm: with-only
  - name: words-handed-off
    type: tool_used
    tool: Skill
    input_match: 'write-with-style'
    min: 1
    arm: with-only
