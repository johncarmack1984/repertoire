<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[A title that states the point]</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.18.0/dist/maplibre-gl.css">
<!-- data-map:lib css -->
<!-- /data-map:lib css -->
<script type="application/json" id="dm-spec">
{
 "version": 1,
 "idiom": [],
 "extent": "world",
 "projection": {
  "type": "crs",
  "name": "custom:equal-earth",
  "definition": "+proj=eqearth +lon_0=0 +datum=WGS84 +units=m +no_defs",
  "property": "equal-area"
 },
 "pitch": 0,
 "controls": [],
 "animation": null,
 "omit": [
  "north-arrow",
  "scale-bar",
  "zoom-buttons"
 ],
 "tiles": [],
 "fonts": [
  "system-ui"
 ],
 "zoom": {
  "min": "fit",
  "max": "fit+3"
 },
 "legend": "data/legend.json",
 "companions": [],
 "decisions": []
}
</script>
</head>
<body>
<header>
<h1 id="dm-title">[A title that states the point]</h1>
<p id="dm-subtitle">[What is mapped, where, and when]</p>
</header>
<div id="dm-map-cell"><div id="map"></div></div>
<aside id="dm-side">
<div id="dm-legend"></div>
<div id="dm-companions"></div>
</aside>
<footer>
<p id="dm-source">Source: [who published the data, its title, and its date]</p>
<p id="dm-credits">[Projection and boundary credits]</p>
</footer>
<!-- data-map:data -->
<!-- /data-map:data -->
<!-- data-map:lib js -->
<!-- /data-map:lib js -->
<script type="module">
const spec = DataMap.spec;
const libs = {};
if (spec.projection) {
  libs.maplibregl = await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.18.0/dist/maplibre-gl.mjs');
  if (spec.projection.type === 'crs') {
    libs.proj4Url = 'https://cdn.jsdelivr.net/npm/proj4@2.22.0/+esm';
    libs.proj4 = (await import(libs.proj4Url)).default;
  }
  if ((spec.tiles || []).some(t => /\.pmtiles$/.test(t.url || ''))) {
    libs.pmtiles = await import('https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/+esm');
    libs.basemaps = await import('https://cdn.jsdelivr.net/npm/@protomaps/basemaps@5.7.2/+esm');
  }
}
await DataMap.start(libs);
</script>
</body>
</html>
