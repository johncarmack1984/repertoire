schema_version: "1.1"
name: refine-straight-flows
plugins:
  - ../..
context:
  scaffold_script: scaffold.sh
graders:
  - name: keeps-every-center
    type: regex
    target: { source: file, path: freight-map/index.html }
    pattern: '^(?=[\s\S]*Chicago)(?=[\s\S]*Milwaukee)(?=[\s\S]*Indianapolis)(?=[\s\S]*Columbus)(?=[\s\S]*Detroit)(?=[\s\S]*St\. Louis)(?=[\s\S]*Kansas City)(?=[\s\S]*Des Moines)'
    weight: 2
  # Indicators: reported, not scored.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?data-map"'
    arm: with-only
  - name: datamap-ran
    type: tool_used
    tool: Bash
    input_match: 'datamap\.py'
    min: 1
    arm: with-only
