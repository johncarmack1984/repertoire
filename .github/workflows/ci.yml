name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.302
      - name: Validate the marketplace and the plugins
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
            claude plugin validate --strict "$plugin.claude-plugin/plugin.json"
            claude plugin validate --strict "${plugin}skills"
          done
      - name: Lint the shell scripts and the eval scaffolds
        run: shellcheck -x plugins/sidework/scripts/*.sh plugins/sidework/evals/_fixtures/lib.sh plugins/sidework/evals/*/scaffold.sh plugins/data-story/evals/*/scaffold.sh
      - name: Compile the lens miner
        run: |
          python3 -m py_compile plugins/build-review-lens/skills/build-review-lens/scripts/mine_reviews.py
          python3 plugins/build-review-lens/skills/build-review-lens/scripts/mine_reviews.py --help > /dev/null
      - name: Build every eval fixture
        run: |
          for scaffold in plugins/*/evals/*/scaffold.sh; do
            workspace="$(mktemp -d)"
            (cd "$workspace" && bash "$GITHUB_WORKSPACE/$scaffold")
            echo "built $(dirname "$scaffold")"
          done

  nesting-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/sidework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Reproduce the nested-worktree failures
        run: bash scripts/nesting-lab.sh
